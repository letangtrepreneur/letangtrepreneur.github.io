  <section class="zone-danger" id="zone-suppression" hidden>
    <h2>Supprimer ma fiche</h2>
    <p>La suppression est définitive : votre fiche, vos photos et vos coordonnées privées sont effacées immédiatement de notre base, et la fiche disparaît du site en quelques minutes.</p>
    <button type="button" class="bouton secondaire" id="btn-suppr">Supprimer ma fiche</button>
    <div id="confirm-suppr" class="message erreur" hidden>
      <p><strong>Cette action ne peut pas être annulée.</strong> Voulez-vous vraiment supprimer votre fiche ?</p>
      <button type="button" class="bouton danger" id="btn-suppr-oui">Oui, supprimer définitivement</button>
      <button type="button" class="bouton secondaire" id="btn-suppr-non">Non, je la garde</button>
    </div>
  </section>
